name: Microsoft Rewards Cookie 与授权码获取
description: 专用链接捕获 Cookie；带标记的微软授权回跳通过通知复制 AUTH_CODE。
icon: key.fill
homepage: https://github.com/7892798-hash/-
manual: https://github.com/7892798-hash/-/blob/main/COOKIE-CAPTURE.md
open_url: https://rewards.bing.com/earn?egern_capture=1
env_schema:
  ACCOUNT_ID:
    name: 账户标识
    description: 必须与积分小组件、定时任务一致。换微软账户时使用新标识。
    default_value: personal
mitm:
  hostnames:
    - rewards.bing.com
    - www.bing.com
    - login.live.com
scriptings:
  - http_request:
      name: ms-rewards-cookie-capture
      match: '^https://(?:rewards\.bing\.com/(?:earn)?|www\.bing\.com/)\?egern_capture=1(?:&[^#]*)?$'
      script_url: https://raw.githubusercontent.com/7892798-hash/-/main/micsoft.js
      timeout: 5
      body_required: false
      env:
        ACCOUNT_ID: personal
  - http_request:
      name: ms-rewards-auth-capture
      match: '^https://login\.live\.com/oauth20_desktop\.srf\?(?:[^&#]*&)*state=egern_rewards_auth_v1(?:&[^#]*)?$'
      script_url: https://raw.githubusercontent.com/7892798-hash/-/main/micsoft.js
      timeout: 5
      body_required: false
